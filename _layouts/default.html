<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
{% seo %}
<meta property="og:type" content="website">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<title>{{ page.title | default: site.title }}</title>

<!-- Local Inter Font -->
<style>
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400;
  src: url('/ALP/fonts/inter/Inter-Regular.woff2') format('woff2');
  font-display: swap;
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 500;
  src: url('/ALP/fonts/inter/Inter-Medium.woff2') format('woff2');
  font-display: swap;
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 700;
  src: url('/ALP/fonts/inter/Inter-Bold.woff2') format('woff2');
  font-display: swap;
}
</style>

<!-- Main stylesheet -->
<link rel="stylesheet" href="/ALP/css/style.css">
<link rel="icon" type="image/x-icon" href="/ALP/favicon.ico">

{% feed_meta %}
</head>
<body>
{% include nav.html %}

<main id="main">
{{ content }}
</main>

{% include footer.html %}

<!-- GoatCounter analytics -->
<script data-goatcounter="https://budanart.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
