---
layout: default
---
<div class="container py-4">
  <div class="row g-4">
    <div class="col-lg-8">
      <img src="{{ page.image | prepend: site.baseurl }}"
           alt="{{ page.title }} - {{ page.medium }}, {{ page.year }}"
           class="detail-image"
           loading="lazy"
           width="1400"
           height="1050">
    </div>
    <div class="col-lg-4">
      <div class="detail-meta">
        <h1 class="h3">{{ page.title }}</h1>
        <dl class="mb-3">
          <dt>Year</dt>
          <dd>{{ page.year }}</dd>

          <dt>Medium</dt>
          <dd>{{ page.medium }}</dd>

          {% if page.size != "" %}
          <dt>Size</dt>
          <dd>{{ page.size }}</dd>
          {% endif %}
        </dl>

        {% if page.description != "" %}
        <p>{{ page.description }}</p>
        {% endif %}

        {% if page.sold %}
        <p class="badge bg-danger">Sold</p>
        {% else %}
        <a href="{{ site.baseurl }}/mandy-budan-store.html" class="btn btn-outline-dark btn-sm">Inquire</a>
        {% endif %}

        <p class="mt-3"><a href="{{ site.baseurl }}/mandy-budan-paintings.html">&larr; Back to gallery</a></p>
      </div>
    </div>
  </div>
</div>

<!-- Schema.org structured data for SEO -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VisualArtwork",
  "name": "{{ page.title }}",
  "artist": {
    "@type": "Person",
    "name": "Mandy Budan"
  },
  "artMedium": "{{ page.medium }}",
  "dateCreated": "{{ page.year }}",
  "description": "{{ page.description }}",
  "image": "{{ page.image | prepend: site.url | prepend: site.baseurl }}"
}
</script>
